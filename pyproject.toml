[project]
name = "demongo"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.2.0",
    "flask>=3.1.3",
    "flask-babel>=4.0.0",
    "flask-caching>=2.5.1",
    "flask-limiter>=4.1.1",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-migrate>=4.0.7",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.2",
    "python-decouple>=3.8",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "wtforms>=3.2.1",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1.0"]
postgresql = ["psycopg2-binary>=2.9.9"]

[tool.ruff]
line-length = 120
target-version = "py314"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
